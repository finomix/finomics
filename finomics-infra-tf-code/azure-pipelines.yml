trigger:
- none

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: runPlan
    type: boolean
    default: true
  - name: runApply
    type: boolean
    default: true
  - name: runDestroy
    type: boolean
    default: false   # ⚠️ WARNING: destroys infra when enabled

variables:
  TF_DIR: 'finomics-infra-tf-code/finomix-tf-config'

stages:
- stage: Terraform_Deployment
  displayName: 'Deploy Resources using Terraform'
  jobs:
  - job: Terraform
    displayName: 'Terraform Operations'
    variables:
      - group: aws-creds-terraform-herbalife

    steps:
    # Checkout repo
    - checkout: self

    # Install Terraform
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '1.5.7'

    # Terraform Init
    - task: Bash@3
      displayName: 'Terraform Init'
      inputs:
        targetType: 'inline'
        script: |
          terraform -chdir=$(TF_DIR) init \
            -backend-config="bucket=finomics-aws-terraform-pov-new-statefile" \
            -backend-config="key=terraform-2/state/terraform.tfstate" \
            -backend-config="region=us-east-1"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: us-east-1

    # Terraform Plan
    - task: Bash@3
      displayName: 'Terraform Plan'
      condition: and(succeeded(), eq('${{ parameters.runPlan }}', true))
      inputs:
        targetType: 'inline'
        script: |
          terraform -chdir=$(TF_DIR) plan -out=tfplan
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: us-east-1

    # Terraform Apply
    - task: Bash@3
      displayName: 'Terraform Apply'
      condition: and(succeeded(), eq('${{ parameters.runApply }}', true))
      inputs:
        targetType: 'inline'
        script: |
          terraform -chdir=$(TF_DIR) apply -auto-approve tfplan
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: us-east-1

    # Terraform Destroy
    - task: Bash@3
      displayName: 'Terraform Destroy'
      condition: and(succeeded(), eq('${{ parameters.runDestroy }}', true))
      inputs:
        targetType: 'inline'
        script: |
          terraform -chdir=$(TF_DIR) destroy -auto-approve
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: us-east-1
